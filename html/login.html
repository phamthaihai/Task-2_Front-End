<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
    <div class="login-shell">
        <div class="text-center mb-4">
            <div class="logo-badge">M</div>
            <h1 class="welcome-title">Welcome Back!</h1>
            <p class="welcome-subtitle">Sign in to continue to your account.</p>
        </div>

        <div class="login-card">
            <form id="loginForm">
                <h2 class="login-card-title">Login to your account</h2>
                <p class="login-card-subtitle">Enter your email and password to get started.</p>

                <div class="mb-3 mt-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control custom-input" placeholder="phamthaihai@gmail.com" required>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label mb-0">Password</label>
                        <a href="#" class="text-link">Forgot password?</a>
                    </div>
                    <div class="password-wrap">
                        <input type="password" id="password" class="form-control custom-input" placeholder="••••••••" required>
                        <button type="button" class="show-password-btn">Show</button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="remember-check">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn login-btn w-100">Sign In</button>

                <div class="signup-line text-center">
                    <span>Don't have an account? <a href="#">Create an account</a></span>
                </div>
            </form>
        </div>
    </div>

    <div id="loginSuccessModal" class="success-modal hidden" role="dialog" aria-modal="true" aria-labelledby="successModalTitle">
        <div class="success-modal-box">
            <div class="success-modal-icon">✓</div>
            <h5 id="successModalTitle">Login successful</h5>
            <button id="successOkBtn" type="button" class="btn btn-primary px-4">OK</button>
        </div>
    </div>

    <footer class="login-footer">
        &copy; 2026 My Website. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const successModal = document.getElementById("loginSuccessModal");
        const successOkBtn = document.getElementById("successOkBtn");
        const passwordField = document.getElementById("password");
        const showPasswordBtn = document.querySelector(".show-password-btn");

        showPasswordBtn.addEventListener("click", function () {
            const isPassword = passwordField.type === "password";
            passwordField.type = isPassword ? "text" : "password";
            showPasswordBtn.textContent = isPassword ? "Hide" : "Show";
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                return;
            }

            successModal.classList.remove("hidden");
            successModal.classList.add("show");
        });

        successOkBtn.addEventListener("click", function () {
            window.location.href = "home.html";
        });
    </script>
</body>
</html>
